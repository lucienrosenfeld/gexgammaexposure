[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "espa"
version = "0.1.0"
description = "ES post-auction inventory-resolution strategy: research framework implementing the master specification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["espa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
